<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mittalo Login</title>
<link rel="stylesheet" href="style.css">


</head>
<body>

<div class="login-container">
    <div class="login-left">
        <!-- Brand Logo -->
        <img src="/assests/images/M logo.png" alt="Mittalo Logo" class="brand-logo" width="100%" height="100%">
    </div>
    <div class="login-right">
        <h2>Welcome to Mittalo</h2>
        <p>Login to continue shopping fresh Masale & Confectionery</p>
        <input type="text" id="username" placeholder="Enter Mobile Number or Email">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
        <div class="links">
            <a href="#">New User? Sign Up</a>
            <a href="#">Forgot Password?</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
